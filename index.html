<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Morrow — Connection Lost</title>

  <!-- Inline SVG Data-URI Favicon matching Morrow's burnt-orange & obsidian aesthetic -->
  <link rel="icon" type="image/svg+xml" href="app logo(web).jpg" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Chakra Petch & Orbitron for geometric segmented digits, Inter & Space Grotesk for clean UI -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
            digit: ['Chakra Petch', 'sans-serif'],
          },
          colors: {
            morrow: {
              bg: '#040101',
              accent: '#C83214',
              accentHover: '#DF3B1A',
              accentDark: '#7C1B09',
            }
          }
        }
      }
    };
  </script>

  <style>
    /* Base obsidian atmosphere */
    html, body {
      background-color: #040101;
      color: #ffffff;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Ambient Crimson/Burnt-Orange Glows matching the reference GIF */
    @keyframes ambientPulseLeft {
      0%, 100% {
        transform: translate3d(0, 0, 0) scale(1);
        opacity: 0.85;
      }
      50% {
        transform: translate3d(18px, -14px, 0) scale(1.06);
        opacity: 1;
      }
    }

    @keyframes ambientPulseRight {
      0%, 100% {
        transform: translate3d(0, 0, 0) scale(1);
        opacity: 0.8;
      }
      50% {
        transform: translate3d(-20px, -16px, 0) scale(1.08);
        opacity: 1;
      }
    }

    .glow-left {
      background: radial-gradient(
        circle at center,
        rgba(182, 42, 16, 0.24) 0%,
        rgba(120, 24, 8, 0.11) 38%,
        rgba(4, 1, 1, 0) 72%
      );
      animation: ambientPulseLeft 9s ease-in-out infinite;
    }

    .glow-right {
      background: radial-gradient(
        circle at center,
        rgba(186, 44, 16, 0.25) 0%,
        rgba(115, 22, 8, 0.12) 40%,
        rgba(4, 1, 1, 0) 72%
      );
      animation: ambientPulseRight 11s ease-in-out infinite;
    }

    /* Odometer / Slot-machine Rolling 404 Mask & Digit Styling */
    .digit-viewport {
      position: relative;
      height: 158px;
      overflow: hidden;
      user-select: none;
      /* Smooth vertical fade mask so upper & lower neighbor digits peek out just like the GIF */
      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0, 0, 0, 0.42) 18%,
        rgba(0, 0, 0, 1) 42%,
        rgba(0, 0, 0, 1) 64%,
        rgba(0, 0, 0, 0.35) 86%,
        transparent 100%
      );
      mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        rgba(0, 0, 0, 0.42) 18%,
        rgba(0, 0, 0, 1) 42%,
        rgba(0, 0, 0, 1) 64%,
        rgba(0, 0, 0, 0.35) 86%,
        transparent 100%
      );
    }

    @media (min-width: 640px) {
      .digit-viewport {
        height: 196px;
      }
    }

    .digit-reel {
      display: flex;
      flex-direction: column;
      align-items: center;
      will-change: transform;
      transition: transform 1.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .digit-cell {
      height: 78px;
      line-height: 78px;
      font-family: 'Chakra Petch', sans-serif;
      font-weight: 700;
      font-size: 4.5rem;
      letter-spacing: -0.02em;
      background: linear-gradient(180deg, #dc3b1c 15%, #9b220c 85%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 18px rgba(200, 50, 20, 0.22));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (min-width: 640px) {
      .digit-cell {
        height: 96px;
        line-height: 96px;
        font-size: 5.75rem;
      }
    }

    /* Subtle tactile button glow */
    .btn-morrow-solid {
      background: linear-gradient(180deg, #d43818 0%, #b82b10 100%);
      box-shadow:
        0 4px 20px rgba(200, 50, 20, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.16);
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .btn-morrow-solid:hover {
      background: linear-gradient(180deg, #e2401f 0%, #c83214 100%);
      box-shadow:
        0 6px 28px rgba(216, 58, 26, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.24);
      transform: translateY(-1px);
    }

    .btn-morrow-solid:active {
      transform: translateY(0px) scale(0.98);
    }

    .btn-morrow-outline {
      background: rgba(12, 4, 4, 0.45);
      border: 1px solid rgba(200, 50, 20, 0.75);
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .btn-morrow-outline:hover {
      background: rgba(200, 50, 20, 0.16);
      border-color: #df3b1a;
      box-shadow: 0 0 20px rgba(200, 50, 20, 0.25);
      transform: translateY(-1px);
    }

    .btn-morrow-outline:active {
      transform: translateY(0px) scale(0.98);
    }

    /* Subtle entrance fade */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-up {
      animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative selection:bg-morrow-accent selection:text-white">

  <!-- Ambient Radial Background Glows (Left & Bottom-Right) -->
  <div class="pointer-events-none fixed inset-0 overflow-hidden z-0" aria-hidden="true">
    <div class="glow-left absolute -left-[22%] top-[8%] w-[68vw] h-[68vw] max-w-[820px] max-h-[820px] rounded-full"></div>
    <div class="glow-right absolute -right-[16%] -bottom-[22%] w-[68vw] h-[68vw] max-w-[840px] max-h-[840px] rounded-full"></div>
  </div>

  <!-- Top Navigation Bar (Logo Left, Clean Minimal Header) -->
  <header class="relative z-20 w-full max-w-[1380px] mx-auto px-6 sm:px-12 pt-6 sm:pt-7 flex items-center justify-between">
    <!-- Left Brand Logo: Uses app logo(web).jpg with seamless fallback if file is missing -->
    <a href="#reload" onclick="handleReloadSite(event)" class="group flex items-center gap-3 focus:outline-none rounded-lg" aria-label="Morrow">
      <div class="relative flex items-center">
        <img
          id="brand-logo-img"
          src="app logo(web).jpg"
          alt="Morrow Logo"
          class="h-9 sm:h-10 w-auto object-contain rounded-lg transition-transform duration-300 group-hover:scale-105"
          onerror="this.style.display='none'; document.getElementById('brand-logo-fallback').classList.remove('hidden');"
        />
        <!-- Fallback emblem matching the striped crimson-orange aesthetic if app logo(web).jpg is not found -->
        <div id="brand-logo-fallback" class="hidden flex items-center gap-2.5">
          <svg class="w-9 h-9 text-morrow-accent transition-transform duration-300 group-hover:scale-105" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="40" height="40" rx="10" fill="#140504" stroke="#C83214" stroke-opacity="0.55" stroke-width="1.2"/>
            <path d="M9 28V12h4.2L20 21.8 26.8 12H31v16h-4V18.6L20 28.4l-7-9.8V28H9z" fill="#D43818"/>
          </svg>
        </div>
        <span class="ml-2.5 font-display font-semibold tracking-tight text-white/95 text-lg sm:text-xl group-hover:text-white transition-colors">
          Morrow
        </span>
      </div>
    </a>
  </header>

  <!-- Main Centerpiece Hero -->
  <main class="relative z-10 flex-1 flex flex-col items-center justify-center px-6 text-center -mt-6 sm:-mt-8">
    <!-- Animated Rolling 404 Odometer Display -->
    <div
      id="odometer-container"
      onclick="triggerSlotRoll()"
      title="Click to re-sync signal"
      class="relative flex items-center justify-center gap-3 sm:gap-5 cursor-pointer select-none"
      aria-label="404 Error"
    >
      <!-- Digit 1 (Target: 4) -->
      <div class="digit-viewport w-[58px] sm:w-[76px]">
        <div id="reel-0" class="digit-reel"></div>
      </div>

      <!-- Digit 2 (Target: 0) -->
      <div class="digit-viewport w-[58px] sm:w-[76px]">
        <div id="reel-1" class="digit-reel"></div>
      </div>

      <!-- Digit 3 (Target: 4) -->
      <div class="digit-viewport w-[58px] sm:w-[76px]">
        <div id="reel-2" class="digit-reel"></div>
      </div>

      <!-- Subtle bottom vignette blend into the headline -->
      <div class="pointer-events-none absolute inset-x-0 bottom-0 h-10 bg-gradient-to-t from-[#040101] via-[#040101]/80 to-transparent"></div>
    </div>

    <!-- Error Headline & Subtitle overlapping gently with the bottom fade of the digits -->
    <div class="relative z-20 -mt-8 sm:-mt-10 animate-fade-up">
      <h1 class="font-display font-semibold text-3xl sm:text-[2.65rem] tracking-tight text-white leading-tight">
        Connection Lost!
      </h1>
      <p class="mt-2.5 sm:mt-3 text-sm sm:text-[0.98rem] text-neutral-300/90 font-normal max-w-md mx-auto leading-relaxed">
        Sorry we are encountering issues with the site at the moment. Please logging in after a while!
      </p>

      <!-- Primary Reload CTA Pill Button -->
      <div class="mt-7 sm:mt-8 flex items-center justify-center">
        <button
          type="button"
          id="reload-btn"
          onclick="handleReloadSite(event)"
          class="btn-morrow-solid group inline-flex items-center justify-center gap-2.5 px-7 sm:px-8 py-3 rounded-full text-xs sm:text-sm font-medium text-white tracking-wide cursor-pointer focus:outline-none focus:ring-2 focus:ring-morrow-accent/70 focus:ring-offset-2 focus:ring-offset-[#040101]"
        >
          <svg
            id="reload-icon"
            class="w-4 h-4 transition-transform duration-500 group-hover:rotate-180"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <polyline points="21 3 21 9 15 9" />
          </svg>
          <span id="reload-btn-text">Try Again</span>
        </button>
      </div>
    </div>
  </main>

  <!-- Minimalist Bottom-Left Footer -->
  <footer class="relative z-20 w-full max-w-[1380px] mx-auto px-6 sm:px-12 pb-6 sm:pb-7 flex items-center justify-between">
    <p class="text-xs sm:text-[13px] text-neutral-400/90 font-normal tracking-wide">
      © 2026 Morrow
    </p>
  </footer>

  <!-- Toast Notification Banner (Replaces alert() cleanly) -->
  <div
    id="toast-banner"
    class="fixed bottom-6 right-6 z-50 pointer-events-none opacity-0 translate-y-3 transition-all duration-300"
  >
    <div class="flex items-center gap-3 px-4 py-3 rounded-2xl bg-[#120605]/95 border border-morrow-accent/50 shadow-2xl backdrop-blur-md text-xs sm:text-sm text-white">
      <span class="w-2 h-2 rounded-full bg-morrow-accent animate-ping"></span>
      <span id="toast-message">Reloading Morrow...</span>
    </div>
  </div>

  <script>
    /**
     * Rolling Odometer 404 Engine
     * Recreates the exact vertical digit reel seen in the template GIF:
     * Numbers roll smoothly through intermediate digits (e.g. 7-0-9 -> 5-9-0 -> 4-0-4)
     * with neighboring digits peeking above and below the active row.
     */
    const TARGET_DIGITS = [4, 0, 4];
    const REEL_CYCLES = 2; // Number of full 0-9 cycles per roll
    let isRolling = false;
    let autoLoopTimer = null;

    function getCellHeight() {
      return window.innerWidth >= 640 ? 96 : 78;
    }

    function buildReels() {
      TARGET_DIGITS.forEach((target, reelIdx) => {
        const reel = document.getElementById(`reel-${reelIdx}`);
        reel.innerHTML = '';

        // Build a long vertical strip of digits so neighbors always peek above & below
        // Ends with [..., (target - 1), target, (target + 1)] so target sits centered in the viewport
        const sequence = [];
        const totalSteps = (REEL_CYCLES + reelIdx) * 10 + target;

        // Start 1 digit before 0 so top neighbor is always populated
        for (let i = -1; i <= totalSteps + 2; i++) {
          const digitVal = ((i % 10) + 10) % 10;
          sequence.push(digitVal);
        }

        sequence.forEach((num) => {
          const cell = document.createElement('div');
          cell.className = 'digit-cell';
          cell.textContent = num;
          reel.appendChild(cell);
        });

        // Store target index inside sequence (offset by +1 because sequence starts at i = -1)
        reel.dataset.targetIndex = String(totalSteps + 1);
      });
    }

    function positionReelImmediate(reel, index) {
      const cellH = getCellHeight();
      // Center the target cell inside the 2-cell-tall viewport (offset by 0.5 * cellH)
      const offset = index * cellH - cellH * 0.42;
      reel.style.transition = 'none';
      reel.style.transform = `translate3d(0, -${offset}px, 0)`;
    }

    function animateReelToTarget(reel, targetIndex, durationMs) {
      const cellH = getCellHeight();
      const offset = targetIndex * cellH - cellH * 0.42;
      reel.style.transition = `transform ${durationMs}ms cubic-bezier(0.18, 0.96, 0.32, 1)`;
      reel.style.transform = `translate3d(0, -${offset}px, 0)`;
    }

    function triggerSlotRoll() {
      if (isRolling) return;
      isRolling = true;

      TARGET_DIGITS.forEach((target, reelIdx) => {
        const reel = document.getElementById(`reel-${reelIdx}`);
        const targetIndex = parseInt(reel.dataset.targetIndex, 10);

        // Start near the top of the strip (around 7-0-9 / 5-9-0 like the template GIF)
        const startOffsetIdx = 7 - reelIdx * 2;
        positionReelImmediate(reel, Math.max(1, startOffsetIdx));

        // Force reflow before starting smooth roll animation
        void reel.offsetHeight;

        const duration = 1250 + reelIdx * 260;
        animateReelToTarget(reel, targetIndex, duration);
      });

      setTimeout(() => {
        isRolling = false;
      }, 1900);
    }

    // Re-align reels seamlessly on window resize
    window.addEventListener('resize', () => {
      if (isRolling) return;
      TARGET_DIGITS.forEach((_, reelIdx) => {
        const reel = document.getElementById(`reel-${reelIdx}`);
        const targetIndex = parseInt(reel.dataset.targetIndex, 10);
        positionReelImmediate(reel, targetIndex);
      });
    });

    // Toast notification helper
    let toastTimeout = null;
    function showToast(msg) {
      const banner = document.getElementById('toast-banner');
      const label = document.getElementById('toast-message');
      label.textContent = msg;
      banner.classList.remove('opacity-0', 'translate-y-3', 'pointer-events-none');

      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        banner.classList.add('opacity-0', 'translate-y-3', 'pointer-events-none');
      }, 3000);
    }

    // Focus site reload handler with tactile feedback + page reload
    function handleReloadSite(e) {
      if (e) e.preventDefault();
      const btn = document.getElementById('reload-btn');
      const icon = document.getElementById('reload-icon');
      const label = document.getElementById('reload-btn-text');

      if (btn) btn.disabled = true;
      if (icon) icon.classList.add('animate-spin');
      if (label) label.textContent = 'Reloading...';

      triggerSlotRoll();
      showToast('Refreshing Morrow connection...');

      setTimeout(() => {
        window.location.reload();
      }, 650);
    }

    // Initialize reels and run periodic subtle GIF-like replay loop
    window.addEventListener('DOMContentLoaded', () => {
      buildReels();
      triggerSlotRoll();

      // Periodically replay the signature rolling 404 animation just like the GIF
      autoLoopTimer = setInterval(() => {
        if (!document.hidden && !isRolling) {
          triggerSlotRoll();
        }
      }, 5200);
    });
  </script>
</body>
</html>
