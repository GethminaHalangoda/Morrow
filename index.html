<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | System Maintenance in Progress</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for crisp vector icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#0d1117] text-slate-200 font-sans min-h-screen flex flex-col justify-between relative overflow-x-hidden selection:bg-indigo-500 selection:text-white">

    <!-- Subtle Ambient Space / Grid Background -->
    <div class="fixed inset-0 z-0 pointer-events-none">
        <img 
            src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=2072&q=80" 
            alt="Subtle Space Horizon" 
            onerror="this.style.display='none'"
            class="w-full h-full object-cover opacity-20 mix-blend-screen"
        >
        <div class="absolute inset-0 bg-gradient-to-b from-[#0d1117]/70 via-[#0d1117]/85 to-[#0d1117]"></div>
        <div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[32rem] h-[32rem] bg-indigo-500/10 rounded-full blur-3xl animate-pulse-slow"></div>
    </div>

    <!-- Minimal Top Header -->
    <header class="relative z-10 w-full max-w-5xl mx-auto px-6 py-6 flex items-center justify-between">
        <a href="/" class="flex items-center gap-2.5 text-slate-300 hover:text-white transition-colors">
            <i class="fa-brands fa-github text-2xl"></i>
            <span class="font-semibold text-sm tracking-wide">Status</span>
        </a>
        <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-800/80 border border-slate-700/70 text-xs font-mono text-slate-400">
            <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
            404 / Offline
        </span>
    </header>

    <!-- Main Centered GitHub-Style Graphic & Minimal Message -->
    <main class="relative z-10 flex-grow flex items-center justify-center px-6 py-8">
        <div class="w-full max-w-xl text-center">
            
            <!-- GitHub-Style Custom Parallax/Floating Space Graphic -->
            <div class="relative mx-auto w-72 h-64 sm:w-80 sm:h-72 mb-6 flex items-center justify-center select-none">
                <!-- Background Planet / Moon Ring -->
                <svg viewBox="0 0 320 260" class="w-full h-full drop-shadow-2xl overflow-visible" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Distant Stars -->
                    <circle cx="45" cy="45" r="2" fill="#94a3b8" opacity="0.6"/>
                    <circle cx="275" cy="35" r="2.5" fill="#818cf8" opacity="0.8"/>
                    <circle cx="290" cy="180" r="1.5" fill="#94a3b8" opacity="0.5"/>
                    <circle cx="30" cy="195" r="2" fill="#38bdf8" opacity="0.6"/>
                    <path d="M70 25L72 30L77 32L72 34L70 39L68 34L63 32L68 30L70 25Z" fill="#cbd5e1" opacity="0.7"/>
                    <path d="M250 95L251.5 98.5L255 100L251.5 101.5L250 105L248.5 101.5L245 100L248.5 98.5L250 95Z" fill="#818cf8" opacity="0.8"/>

                    <!-- Glowing Horizon Planet -->
                    <circle cx="160" cy="145" r="78" fill="url(#planetGrad)" stroke="#334155" stroke-width="1.5"/>
                    <!-- Planet Craters -->
                    <ellipse cx="130" cy="125" rx="14" ry="8" transform="rotate(-15 130 125)" fill="#0f172a" opacity="0.45"/>
                    <ellipse cx="195" cy="155" rx="18" ry="10" transform="rotate(12 195 155)" fill="#0f172a" opacity="0.4"/>
                    <circle cx="155" cy="175" r="7" fill="#0f172a" opacity="0.35"/>

                    <!-- Orbital Ring Back -->
                    <path d="M52 145C52 118 100 98 160 98C220 98 268 118 268 145" stroke="#475569" stroke-width="2" stroke-dasharray="6 6" opacity="0.6"/>

                    <!-- Floating Astronaut / Bot Mascot (GitHub Octocat-inspired space explorer) -->
                    <g class="animate-float">
                        <!-- Tether Cable -->
                        <path d="M112 138C85 150 75 185 95 215" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
                        
                        <!-- Jetpack -->
                        <rect x="128" y="96" width="64" height="44" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
                        <!-- Jetpack Thruster Glow -->
                        <path d="M142 140L138 156L148 146L142 140Z" fill="#38bdf8" opacity="0.8"/>
                        <path d="M178 140L182 156L172 146L178 140Z" fill="#38bdf8" opacity="0.8"/>

                        <!-- Helmet -->
                        <circle cx="160" cy="95" r="36" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5"/>
                        <!-- Cat/Bot Ears on Helmet -->
                        <path d="M132 70L128 52L146 62Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round"/>
                        <path d="M188 70L192 52L174 62Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round"/>
                        
                        <!-- Dark Visor -->
                        <rect x="136" y="77" width="48" height="32" rx="16" fill="#0f172a"/>
                        <!-- Visor Reflection -->
                        <path d="M144 84C150 81 162 81 168 84" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
                        <!-- Cute Digital Eyes -->
                        <circle cx="150" cy="94" r="3.5" fill="#38bdf8"/>
                        <circle cx="170" cy="94" r="3.5" fill="#38bdf8"/>

                        <!-- Floating Wrench / Signpost Prop -->
                        <g transform="translate(202, 72) rotate(18)">
                            <rect x="0" y="0" width="46" height="26" rx="6" fill="#1e293b" stroke="#818cf8" stroke-width="2"/>
                            <text x="23" y="17" text-anchor="middle" fill="#e2e8f0" font-family="JetBrains Mono, monospace" font-size="12" font-weight="bold">404</text>
                        </g>
                    </g>

                    <!-- Orbital Ring Front -->
                    <path d="M42 145C42 174 95 196 160 196C225 196 278 174 278 145" stroke="url(#ringGrad)" stroke-width="3" stroke-linecap="round"/>

                    <defs>
                        <linearGradient id="planetGrad" x1="100" y1="75" x2="220" y2="215" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#312e81"/>
                            <stop offset="0.5" stop-color="#1e1b4b"/>
                            <stop offset="1" stop-color="#0f172a"/>
                        </linearGradient>
                        <linearGradient id="ringGrad" x1="42" y1="145" x2="278" y2="145" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#6366f1" stop-opacity="0.1"/>
                            <stop offset="0.5" stop-color="#818cf8" stop-opacity="0.9"/>
                            <stop offset="1" stop-color="#38bdf8" stop-opacity="0.1"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>

            <!-- Clean, Minimalist Headline -->
            <h1 class="text-2xl sm:text-4xl font-bold text-white tracking-tight mb-3">
                This isn't the page you're looking for.
            </h1>

            <!-- Short, Uncluttered Subtitle -->
            <p class="text-slate-400 text-sm sm:text-base max-w-md mx-auto mb-8 leading-relaxed">
                We're currently down for brief maintenance. Please check back again soon.
            </p>

            <!-- Simple Single Action -->
            <div class="flex items-center justify-center">
                <button onclick="reloadPage()" class="px-6 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700/90 active:bg-slate-800 border border-slate-700 text-slate-200 hover:text-white font-medium text-sm transition-all duration-200 inline-flex items-center gap-2 shadow-lg cursor-pointer">
                    <i id="refresh-icon" class="fa-solid fa-rotate-right text-xs text-indigo-400"></i>
                    <span>Try Again</span>
                </button>
            </div>

        </div>
    </main>

    <!-- Minimal Footer -->
    <footer class="relative z-10 w-full max-w-5xl mx-auto px-6 py-6 flex items-center justify-center text-xs text-slate-500">
        <span>&copy; <span id="year"></span> &bull; Temporarily Unavailable</span>
    </footer>

    <!-- Minimal Interactive Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('year').textContent = new Date().getFullYear();
        });

        function reloadPage() {
            const icon = document.getElementById('refresh-icon');
            icon.classList.add('fa-spin');
            setTimeout(() => {
                window.location.reload();
            }, 400);
        }
    </script>
</body>
</html>
